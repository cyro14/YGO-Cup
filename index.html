<html lang="pt-BR">
<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"></meta>
    <title>YGO Cup - Duelos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --gold: #d4af37; --hover-glow: #00bcd4; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            color: #333333; 
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        h1 { 
            color: var(--gold); 
            margin-bottom: 15px; 
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-top: 0;
        }
        
        p { color: #555555; margin-top: 0; font-size: 15px; font-weight: 500; }

        
      
        /* --- FILTRO --- */
        #filtro-cartas {
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #333;
            background-color: #f4f4f4;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- TELA DA ARENA DE DUELO --- */
        #screen-arena { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }

        .round-title {
            font-size: 20px; color: #d32f2f; margin-bottom: 30px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
        }

        .duel-container { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 600px; }

        .arena-card {
            width: 40vw; max-width: 160px; height: 58vw; max-height: 235px;
            background-color: #2c3e50; border: 3px solid #333; border-radius: 8px;
            cursor: pointer; overflow: hidden; transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
        }

        .arena-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .arena-card:hover { transform: translateY(-10px) scale(1.05); border-color: var(--hover-glow); box-shadow: 0 10px 30px rgba(0, 188, 212, 0.4); }

        .vs-text { font-size: 28px; font-weight: bold; color: #1a1a1a; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

        /* --- TELA DO CHAVEAMENTO FINAL --- */
        #screen-bracket { display: none; width: 100%; }

        .scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; margin-top: 20px; }

        .bracket-board {
            display: flex; justify-content: space-between; align-items: stretch;
            min-width: 1200px; 
            
            /* Mantemos apenas a cor sólida como segurança */
            background-color: #1a1a1a; 
            
            padding: 40px; margin: 0 auto;
            border-radius: 12px; position: relative;
        }


        .side, .center-stage { display: flex; gap: 10px; position: relative; z-index: 1;}
        .side.right { flex-direction: row-reverse; }
        .column { display: flex; flex-direction: column; justify-content: space-around; }
        
        .match { display: flex; flex-direction: column; gap: 4px; background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 6px; border: 1px solid #333; }
        .slot { width: 45px; height: 65px; background-color: #2c3e50; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* --- ESTILOS DE PROGRESSÃO DO TORNEIO --- */
        .slot.winner {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175,             55, 0.4);
        }
        
        .slot.loser {
            position: relative; /* Necessário para a película escura funcionar */
        }
        
        /* Cria uma camada escura por cima da carta perdedora */
        .slot.loser::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7); /* Escurece 70% */
            pointer-events: none; 
            z-index: 10;
        }
        
        .slot.loser img {
            opacity: 0.6; /* Tira o brilho sem usar o filter: grayscale */
        }

        /* Garante que o conteúdo fique por cima do novo wallpaper */
        .side, .center-stage {
            position: relative;
            z-index: 1;
        }
  .center-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 20px; }
        .center-stage h2 { margin: 0; color: var(--gold); font-size: 16px; letter-spacing: 1px; }
        .winner-slot { width: 90px; height: 130px; border: 3px solid var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        .watermark { position: absolute; bottom: 10px; right: 20px; font-size: 14px; color: rgba(255, 255, 255, 0.4); }

        .btn-container { margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        button {
            padding: 12px 24px; background-color: #25D366; 
            color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #128C7E; transform: translateY(-2px); }
        button:disabled { background-color: #888; cursor: not-allowed; transform: none; }
        .btn-restart { background-color: #444; color: white; }
        .btn-restart:hover { background-color: #222; }
      #btn-download:hover { background-color: #2980b9; }
        
    </style>
</head>
<body>

    <h1></h1>
    <div style="margin-bottom: 20px;">
    <select id="filtro-cartas" onchange="iniciarTorneio()">
        <option value="todos">Todas as Cartas</option>
        <option value="monstro">Somente Monstros</option>
        <option value="magia">Somente Magias</option>
        <option value="armadilha">Somente Armadilhas</option>
    </select>
    <button onclick="carregarRanking()" style="background-color: #f39c12; margin-left: 10px;">🏆 Hall da Fama</button>
  </div>
    <!-- TELA 1: ARENA DE DUELOS -->
    <div id="screen-arena">
        <p>Toque na sua carta favorita para vencer o duelo e avançar!</p>
        <div class="round-title" id="round-title">Carregando...</div>
        
        <div class="duel-container">
            <div class="arena-card" onclick="escolherVencedor('p1')">
                <!-- Removido o src="" para evitar o disparo prematuro do erro -->
                <img id="card-left" onerror="trocarCarta(this, 'p1')" alt="Card Left">
            </div>
            <div class="vs-text">VS</div>
            <div class="arena-card" onclick="escolherVencedor('p2')">
                <img id="card-right" onerror="trocarCarta(this, 'p2')" alt="Card Right">
            </div>
        </div>
    </div>

    <!-- TELA 2: RESULTADO E COMPARTILHAMENTO -->
    <div id="screen-bracket">
        <div class="btn-container">
          <button id="btn-download" onclick="baixarResultado()" style="background-color: #3498db;">⬇️ Baixar Imagem</button>
            
            <button id="btn-share" onclick="compartilharResultado()">Compartilhar</button>
            <button class="btn-restart" onclick="iniciarTorneio()">Sortear Novo Torneio</button>
        </div>

        <div class="scroll-wrapper">
            <div class="bracket-board" id="bracket-board"></div>
        </div>
    </div>
  
  <!-- TELA 3: HALL DA FAMA -->
    <div id="screen-ranking" style="display: none; flex-direction: column; align-items: center; margin-top: 20px;">
        <h2 style="color: var(--gold); text-transform: uppercase;">Top 10 da Comunidade</h2>
        <div id="ranking-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 900px; margin-bottom: 20px;"></div>
        <button onclick="iniciarTorneio()">Voltar para a Arena</button>
    </div>
