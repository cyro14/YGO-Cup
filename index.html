<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    </meta>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    </meta>
    <title>YGO Cup - Duelos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1></h1>
    <div style="margin-bottom: 20px;">
        <select id="filtro-cartas" onchange="iniciarTorneio()">
            <option value="todos">Todas as Cartas</option>
            <option value="monstro">Somente Monstros</option>
            <option value="magia">Somente Magias</option>
            <option value="armadilha">Somente Armadilhas</option>
        </select>
        <button onclick="carregarRanking()" style="background-color: #f39c12; margin-left: 10px;">🏆 Hall da
            Fama</button>
            
        <button onclick="toggleFullScreen()" style="padding: 5px 10px; font-size: 14px; background: #34495e; margin-left: 5px;" title="Tela Cheia">⛶</button>
        
    </div>

    <!-- TELA 1: ARENA DE DUELOS -->
    <div id="screen-arena">
        <p id="arena-subtitle">Selecione suas cartas favoritas!</p>
        <div class="round-title" id="round-title">Carregando...</div>

        <!-- Container da Fase de Grupos -->
        <div id="group-container" style="display: none; width: 100%;">
            <div class="group-grid" id="group-grid">
                <!-- Cartas do grupo geradas pelo JS -->
            </div>
            <button id="btn-confirm-group" onclick="confirmarGrupo()" disabled>Avançar 0/2</button>
        </div>

        <!-- Container do Mata-Mata -->
        <div id="duel-container" class="duel-container" style="display: none;">
            <div class="arena-card" onclick="escolherVencedor('p1')">
                <img id="card-left" onerror="trocarCarta(this, 'p1')" alt="Card Left">
            </div>
            <div class="vs-text">VS</div>
            <div class="arena-card" onclick="escolherVencedor('p2')">
                <img id="card-right" onerror="trocarCarta(this, 'p2')" alt="Card Right">
            </div>
        </div>
    </div>

    <!-- TELA 2: RESULTADO E COMPARTILHAMENTO -->
    <div id="screen-bracket">
        <div class="btn-container">
            <button id="btn-download" onclick="baixarResultado()" style="background-color: #3498db;">⬇️ Baixar
                Imagem</button>
            <button id="btn-share" onclick="compartilharResultado()">Compartilhar</button>
            <button class="btn-restart" onclick="iniciarTorneio()">Sortear Novo Torneio</button>
        </div>

        <div class="scroll-wrapper">
            <div class="bracket-board" id="bracket-board"></div>
        </div>
    </div>

    <!-- TELA 3: HALL DA FAMA -->
    <div id="screen-ranking">
        <div id="ranking-board">
            <!-- Background injetado com proxy para o html2canvas ler sem erro de CORS -->
            <img crossorigin="anonymous"
                src="https://wsrv.nl/?url=blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgo9rlwCqNwkgF_bbv409Mdqx24wJlql8My7Hjn1qc2EZnQJaWoNSWQVO_dzIBKjwTLdX_GZ77Q-Fv8Sr-fQNG1IV9aV2xlc5DYay2VFrsaBUm44Fce3uz0v5K1f-3qO-ZDrbTxVX1rQqDhsDrQNOMe0zFo6DV0XF43gfBRjcXzq83L1Km9rFyVgAD70wax/s1600/Design%20sem%20nome%20(14).png&output=webp"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.35; border-radius: 12px; pointer-events: none;"
                alt="Background">

            <h2 style="color: var(--gold); text-transform: uppercase;">🏆 Hall da Fama</h2>
            <p style="color: #ccc; margin-bottom: 25px; font-size: 14px; position: relative; z-index: 1;">As cartas mais
                vitoriosas da comunidade no YGO Cup</p>

            <div id="ranking-container"
                style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; position: relative; z-index: 1;">
            </div>

            <div class="watermark"
                style="margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.4); position: relative; z-index: 1;">
                superygo.blogspot.com • YGO CUP OFICIAL</div>
        </div>

        <div class="btn-container"
            style="margin-top: 20px; display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
            <button id="btn-download-ranking" onclick="baixarRanking()" style="background-color: #3498db;">⬇️ Baixar
                Hall da Fama</button>
            <button class="btn-restart" onclick="iniciarTorneio()">Voltar para a Arena</button>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>

</html>
