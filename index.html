
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"></meta>
    <title>YGO Cup - Duelos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --gold: #d4af37; --hover-glow: #00bcd4; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            color: #333333; 
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }

        h1 { 
            color: var(--gold); 
            margin-bottom: 15px; 
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-top: 0;
        }
        
        p { color: #555555; margin-top: 0; font-size: 15px; font-weight: 500; }

        /* --- FILTRO --- */
        #filtro-cartas {
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #333;
            background-color: #f4f4f4;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- TELA DA ARENA DE DUELO --- */
        #screen-arena { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }

        .round-title {
            font-size: 20px; color: #d32f2f; margin-bottom: 30px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
        }

        .duel-container { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 600px; }

        .arena-card {
            width: 40vw; max-width: 160px; height: 58vw; max-height: 235px;
            background-color: #2c3e50; border: 3px solid #333; border-radius: 8px;
            cursor: pointer; overflow: hidden; transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
        }

        .arena-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .arena-card:hover { transform: translateY(-10px) scale(1.05); border-color: var(--hover-glow); box-shadow: 0 10px 30px rgba(0, 188, 212, 0.4); }

        .vs-text { font-size: 28px; font-weight: bold; color: #1a1a1a; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

        /* --- TELA DO CHAVEAMENTO FINAL --- */
        #screen-bracket { display: none; width: 100%; }

        .scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; margin-top: 20px; }

        .bracket-board {
            display: flex; justify-content: space-between; align-items: stretch;
            min-width: 1200px; 
            
            /* --- CONFIGURAÇÃO DO BACKGROUND --- */
            background-color: #1a1a1a; /* Cor de segurança caso a internet falhe */
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgo9rlwCqNwkgF_bbv409Mdqx24wJlql8My7Hjn1qc2EZnQJaWoNSWQVO_dzIBKjwTLdX_GZ77Q-Fv8Sr-fQNG1IV9aV2xlc5DYay2VFrsaBUm44Fce3uz0v5K1f-3qO-ZDrbTxVX1rQqDhsDrQNOMe0zFo6DV0XF43gfBRjcXzq83L1Km9rFyVgAD70wax/s1600/Design%20sem%20nome%20(14).png'); 
            background-size: cover;
            background-position: center;
            /* ---------------------------------- */
            
            padding: 40px; margin: 0 auto;
            border-radius: 12px; position: relative;
        }

        .side, .center-stage { display: flex; gap: 10px; position: relative; z-index: 1;}
        .side.right { flex-direction: row-reverse; }
        .column { display: flex; flex-direction: column; justify-content: space-around; }
        
        .match { display: flex; flex-direction: column; gap: 4px; background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 6px; border: 1px solid #333; }
        .slot { width: 45px; height: 65px; background-color: #2c3e50; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* --- ESTILOS DE PROGRESSÃO DO TORNEIO --- */
        .slot.winner {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175,             55, 0.4);
        }
        
        .slot.loser {
            position: relative; /* Necessário para a película escura funcionar */
        }
        
        /* Cria uma camada escura por cima da carta perdedora */
        .slot.loser::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7); /* Escurece 70% */
            pointer-events: none; 
            z-index: 10;
        }
        
        .slot.loser img {
            opacity: 0.6; /* Tira o brilho sem usar o filter: grayscale */
        }

        /* Garante que o conteúdo fique por cima do novo wallpaper */
        .side, .center-stage {
            position: relative;
            z-index: 1;
        }
  .center-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 20px; }
        .center-stage h2 { margin: 0; color: var(--gold); font-size: 16px; letter-spacing: 1px; }
        .winner-slot { width: 90px; height: 130px; border: 3px solid var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        .watermark { position: absolute; bottom: 10px; right: 20px; font-size: 14px; color: rgba(255, 255, 255, 0.4); }

        .btn-container { margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        button {
            padding: 12px 24px; background-color: #25D366; 
            color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #128C7E; transform: translateY(-2px); }
        button:disabled { background-color: #888; cursor: not-allowed; transform: none; }
        .btn-restart { background-color: #444; color: white; }
        .btn-restart:hover { background-color: #222; }
        
    </style>
</head>
<body>

    <h1></h1>
    
    <select id="filtro-cartas" onchange="iniciarTorneio()">
        <option value="todos">Todas as Cartas</option>
        <option value="monstro">Somente Monstros</option>
        <option value="magia">Somente Magias</option>
        <option value="armadilha">Somente Armadilhas</option>
    </select>
    
    <!-- TELA 1: ARENA DE DUELOS -->
    <div id="screen-arena">
        <p>Toque na sua carta favorita para vencer o duelo e avançar!</p>
        <div class="round-title" id="round-title">Carregando...</div>
        
        <div class="duel-container">
            <div class="arena-card" onclick="escolherVencedor('p1')">
                <!-- Removido o src="" para evitar o disparo prematuro do erro -->
                <img id="card-left" onerror="trocarCarta(this, 'p1')" alt="Card Left">
            </div>
            <div class="vs-text">VS</div>
            <div class="arena-card" onclick="escolherVencedor('p2')">
                <img id="card-right" onerror="trocarCarta(this, 'p2')" alt="Card Right">
            </div>
        </div>
    </div>

    <!-- TELA 2: RESULTADO E COMPARTILHAMENTO -->
    <div id="screen-bracket">
        <div class="btn-container">
            <button id="btn-share" onclick="compartilharResultado()">Desafiar Amigos</button>
            <button class="btn-restart" onclick="iniciarTorneio()">Sortear Novo Torneio</button>
        </div>

        <div class="scroll-wrapper">
            <div class="bracket-board" id="bracket-board"></div>
        </div>
    </div>

        const nomesFases = ["Fase de Grupos", "Oitavas de Final", "Quartas de Final", "Semifinal", "A Grande Final"];
        const cartaSegura = cartasDatabase[0].url; 

        const urlWallpaper = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgo9rlwCqNwkgF_bbv409Mdqx24wJlql8My7Hjn1qc2EZnQJaWoNSWQVO_dzIBKjwTLdX_GZ77Q-Fv8Sr-fQNG1IV9aV2xlc5DYay2VFrsaBUm44Fce3uz0v5K1f-3qO-ZDrbTxVX1rQqDhsDrQNOMe0zFo6DV0XF43gfBRjcXzq83L1Km9rFyVgAD70wax/s1600/Design%20sem%20nome%20(14).png";
        
        let megaPool = [];
        let torneio = [];
        let faseAtual = 0;
        let partidaAtual = 0;
        let campeao = null;
        let poolDisponivel = []; 

        function embaralhar(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

         function fazerPreload(urls) {
            urls.forEach(url => {
                const img = new Image();
                img.src = url;
         });
            // Faz o download do wallpaper silenciosamente no background
            const imgBg = new Image();
            imgBg.src = urlWallpaper;
        }


        function iniciarTorneio() {
            document.getElementById('screen-bracket').style.display = 'none';
            document.getElementById('screen-arena').style.display = 'flex';

            // Filtragem
            const filtroSelecionado = document.getElementById('filtro-cartas').value;
            if (filtroSelecionado === "todos") {
                megaPool = cartasDatabase.map(carta => carta.url);
            } else {
                megaPool = cartasDatabase
                    .filter(carta => carta.tipo === filtroSelecionado)
                    .map(carta => carta.url);
            }

            if (megaPool.length < 32) {
                alert("Atenção: Adicione pelo menos 32 cartas com o tipo '" + filtroSelecionado + "' no banco de dados para criar um torneio!");
                // Reseta pro filtro default para não quebrar a tela
                document.getElementById('filtro-cartas').value = "todos";
                megaPool = cartasDatabase.map(carta => carta.url);
            }

            let embaralhadas = embaralhar([...megaPool]);
            let cartasDoTorneio = embaralhadas.slice(0, 32);
            poolDisponivel = embaralhadas.slice(32); 

            fazerPreload(cartasDoTorneio);

            torneio = [
                Array.from({length: 16}, () => ({ p1: null, p2: null })),
                Array.from({length: 8}, () => ({ p1: null, p2: null })),
                Array.from({length: 4}, () => ({ p1: null, p2: null })),
                Array.from({length: 2}, () => ({ p1: null, p2: null })),
                Array.from({length: 1}, () => ({ p1: null, p2: null }))
            ];

            for (let i = 0; i < 16; i++) {
                torneio[0][i].p1 = cartasDoTorneio[i * 2];
                torneio[0][i].p2 = cartasDoTorneio[i * 2 + 1];
            }

            faseAtual = 0;
            partidaAtual = 0;
            campeao = null;

            document.getElementById('card-left').dataset.erros = 0;
            document.getElementById('card-right').dataset.erros = 0;

            atualizarArena();
        }

        function atualizarArena() {
            const partida = torneio[faseAtual][partidaAtual];
            const totalDuelos = torneio[faseAtual].length;
            
            document.getElementById('round-title').innerText = `${nomesFases[faseAtual]} - Duelo ${partidaAtual + 1} de ${totalDuelos}`;
            document.getElementById('card-left').src = partida.p1;
            document.getElementById('card-right').src = partida.p2;
        }

        function trocarCarta(imgElement, player) {
            let erros = parseInt(imgElement.dataset.erros || 0);
            if (erros > 3) {
                console.warn("Muitos erros ao carregar imagens. Verifique sua internet.");
                imgElement.onerror = null; 
                return;
            }
            imgElement.dataset.erros = erros + 1;

            if (poolDisponivel.length === 0) {
                poolDisponivel = embaralhar([...megaPool]); 
            }
            
            let novaUrl = poolDisponivel.pop();
            imgElement.src = novaUrl;
            torneio[faseAtual][partidaAtual][player] = novaUrl;
        }

        function escolherVencedor(player) {
            const partida = torneio[faseAtual][partidaAtual];
            const vencedorId = (player === 'p1') ? partida.p1 : partida.p2;

            if (faseAtual === 4) {
                campeao = vencedorId;
                gerarChaveamentoFinal();
                return;
            }

            const proximaPartidaIndex = Math.floor(partidaAtual / 2);
            const isPlayer2 = (partidaAtual % 2 !== 0);

            if (isPlayer2) {
                torneio[faseAtual + 1][proximaPartidaIndex].p2 = vencedorId;
            } else {
                torneio[faseAtual + 1][proximaPartidaIndex].p1 = vencedorId;
            }

            partidaAtual++;
            if (partidaAtual >= torneio[faseAtual].length) {
                faseAtual++;
                partidaAtual = 0;
            }

            document.getElementById('card-left').dataset.erros = 0;
            document.getElementById('card-right').dataset.erros = 0;
            atualizarArena();
        }

        /* FUNÇÃO AUXILIAR PARA O CANVAS COM PROXY DE CORS */
        function getCardHtml(url, extraClass = '') {
            const urlLimpa = url.replace('https://', '');
            const proxyUrl = `https://wsrv.nl/?url=${urlLimpa}&output=webp`;
            const seguraLimpa = cartaSegura.replace('https://', '');
            const fallbackUrl = `https://wsrv.nl/?url=${seguraLimpa}&output=webp`;
            const tagErroFinal = `onerror="this.onerror=null; this.src='${fallbackUrl}';"`;
            
            return `
                <div class="slot ${extraClass}">
                    <img crossorigin="anonymous" src="${proxyUrl}" ${tagErroFinal} alt="Card">
                </div>
            `;
        }

        function gerarChaveamentoFinal() {
            document.getElementById('screen-arena').style.display = 'none';
            document.getElementById('screen-bracket').style.display = 'block';

            const board = document.getElementById('bracket-board');
          
          // Passa o wallpaper pelo proxy para forçar a liberação do CORS no canvas
            const bgLimpo = urlWallpaper.replace('https://', '');
            const bgProxy = `https://wsrv.nl/?url=${bgLimpo}&output=webp`;
          
            // Injeta a imagem com z-index 0 (fundo) e opacidade 0.3 (escurecido)
            board.innerHTML = `
                <img crossorigin="anonymous" src="${bgProxy}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.3; border-radius: 12px; pointer-events: none;" alt="Background">
            `;

            function criarPartidaHtml(roundIndex, matchIndex) {
                const match = torneio[roundIndex][matchIndex];
                let vencedorId = null;

                if (roundIndex < 4) {
                    const nextMatch = torneio[roundIndex + 1][Math.floor(matchIndex / 2)];
                    if (nextMatch.p1 === match.p1 || nextMatch.p2 === match.p1) vencedorId = match.p1;
                    else if (nextMatch.p1 === match.p2 || nextMatch.p2 === match.p2) vencedorId = match.p2;
                } else {
                    vencedorId = campeao;
                }

                const classeP1 = (vencedorId === match.p1) ? 'winner' : 'loser';
                const classeP2 = (vencedorId === match.p2) ? 'winner' : 'loser';

                return `
                    <div class="match">
                        ${getCardHtml(match.p1, classeP1)}
                        ${getCardHtml(match.p2, classeP2)}
                    </div>`;
            }

            function criarColuna(roundIndex, startMatch, endMatch) {
                let colHTML = `<div class="column">`;
                for (let m = startMatch; m <= endMatch; m++) {
                    colHTML += criarPartidaHtml(roundIndex, m);
                }
                colHTML += `</div>`;
                return colHTML;
            }

            let leftSide = document.createElement('div');
            leftSide.className = 'side left';
            leftSide.innerHTML += criarColuna(0, 0, 7);
            leftSide.innerHTML += criarColuna(1, 0, 3);
            leftSide.innerHTML += criarColuna(2, 0, 1);
            leftSide.innerHTML += criarColuna(3, 0, 0);

            let rightSide = document.createElement('div');
            rightSide.className = 'side right';
            rightSide.innerHTML += criarColuna(0, 8, 15);
            rightSide.innerHTML += criarColuna(1, 4, 7);
            rightSide.innerHTML += criarColuna(2, 2, 3);
            rightSide.innerHTML += criarColuna(3, 1, 1);

            let center = document.createElement('div');
            center.className = 'center-stage';
            const finalMatch = torneio[4][0];
            
            const classeFinalP1 = (campeao === finalMatch.p1) ? 'winner extra-slot' : 'loser extra-slot';
            const classeFinalP2 = (campeao === finalMatch.p2) ? 'winner extra-slot' : 'loser extra-slot';

            center.innerHTML = `
                <h1 style="color: #d4af37; font-size: 32px; margin: 0 0 30px 0; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); text-transform: uppercase; text-align: center; letter-spacing: 2px;">Super YGO Cup!</h1>
                <h2>FINAL</h2>
                <div class="match" style="flex-direction:row; background:transparent; border:none; gap:10px;">
                    ${getCardHtml(finalMatch.p1, classeFinalP1)}
                    ${getCardHtml(finalMatch.p2, classeFinalP2)}
                </div>
                <h2>CAMPEÃO</h2>
                ${getCardHtml(campeao, 'winner-slot')}
            `;
            const style = document.createElement('style');
            style.textContent = `.extra-slot { width:55px; height:80px; }`;
            document.head.appendChild(style);

            board.appendChild(leftSide);
            board.appendChild(center);
            board.appendChild(rightSide);
            board.innerHTML += `<div class="watermark">superygo.blogspot.com</div>`;
        }

        async function compartilharResultado() {
            const btn = document.getElementById('btn-share');
            btn.innerText = "Gerando Imagem...";
            btn.disabled = true; 
            
            const board = document.getElementById('bracket-board');
            
            try {
                const canvas = await html2canvas(board, {
                    backgroundColor: null, /* Deixa transparente para mostrar a sua imagem */

                    scale: 2 
                });
                
                canvas.toBlob(async (blob) => {
                    try {
                        const file = new File([blob], 'yu-gi-oh-cup-resultado.png', { type: 'image/png' });
                        const linkBlog = "https://superygo.blogspot.com/p/yu-gi-oh-cup.html";

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    title: 'YGO Cup',
                                    text: "Montei meu chaveamento de Cartas Favoritas! Venha fazer o seu 👇",
                                    url: linkBlog,
                                    files: [file]
                                });
                            } catch (shareErr) {
                                fallbackDownload(blob, linkBlog);
                            }
                        } else {
                            fallbackDownload(blob, linkBlog);
                        }
                    } catch (err) {
                        alert("Erro ao processar a imagem no seu dispositivo.");
                    } finally {
                        btn.innerText = "Desafiar Amigos";
                        btn.disabled = false;
                    }
                }, 'image/png');
                
            } catch (err) {
                alert("Houve um erro ao renderizar o chaveamento. Verifique sua conexão.");
                btn.innerText = "Desafiar Amigos";
                btn.disabled = false;
            }
        }

        function fallbackDownload(blob, linkBlog) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'yu-gi-oh-cup-resultado.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); 
            alert("A imagem foi baixada na sua galeria! Envie-a aos seus amigos junto com o link: " + linkBlog);
        }

        iniciarTorneio();
    </script>
</body>
</html>
